# th08: 東方永夜抄 ~ Imperishable Night, 1.00d

[game]
name = "th08"
title = "東方永夜抄 1.00d"
window_title = "東方永夜抄"
dir = "orig/th08_100d"
exe = "th08.exe"
checksums = "orig/th08_100d.sha1"
original = "build/th08_100d.exe"
game_end = 0x475298  # D3DX8's tables, D3DX8 and the CRT follow

[ghidra]
project = "th08_100d"
functions = "build/functions_100d.csv"

[build]
cflags = ["/Od", "/Gr", "/GX", "/Oi", "/Gy", "/GF"]
# The game's code was compiled with DirectX 8.0's headers (its
# D3DXIMAGE_INFO has 8.0's 20 bytes, not 8.1's 28) and linked with the
# DirectX libraries Visual Studio .NET 2002 itself ships in
# Vc7\PlatformSDK\lib\prerelease (the vs_setup.msi merge module
# zDxF_pre_b). Their d3dx8.lib objects are build 9177 and d3d8, dinput8
# and dsound are Implib700 9111, as the original's Rich header records;
# the DirectX 8.1 SDK's say 9178 and 9210. Its D3DX8 objects also bring
# the compiler banners that fill the original's 0x1e00 bytes of headers.
lib = ['C:\msvc7\PlatformSDK\Lib\prerelease', 'C:\msvc7\lib', 'C:\msvc7\PlatformSDK\Lib', 'C:\psdk\Lib']
hook = "scripts/build_hook.py"  # recovered COMDAT order

[exe]
# The exe's objects are compiled with TH08_EXE, which defines the
# game's data and globals in the files that own them; the DLL build
# binds the original's instead. The link order also decides which copy
# of an inline function compare and the DLL keep.
obj_dir = "build/obj_exe"
defines = ["TH08_EXE=1"]
link_order = "median"
# scripts/build_hook.py generates the code/data ORDER file.
ldflags = ["/SUBSYSTEM:WINDOWS", "/FIXED", "/OPT:REF", "/OPT:ICF", "/OPT:NOWIN98",
           "/ORDER:@build\\exe_order.txt",
           "/NODEFAULTLIB:libc.lib"]
# The original's import table lists DINPUT8, DSOUND and d3d8 first and
# ADVAPI32 and ole32 last; D3DX8 follows the game code and the CRT comes
# last.
libs = ["dinput8.lib", "dsound.lib", "d3d8.lib", "d3dx8.lib", "dxguid.lib", "winmm.lib",
        "kernel32.lib", "user32.lib", "gdi32.lib", "advapi32.lib", "ole32.lib", "uuid.lib",
        "libcmt.lib"]

[psdk]
# VS.NET 2002's own import libraries, which `just psdk-libs` extracts.
libs = ["AdvAPI32.Lib", "Gdi32.Lib", "Kernel32.Lib", "Ole32.Lib", "User32.Lib", "Uuid.Lib", "WinMM.Lib"]

[exe.features]
# FEAT=orig_checksum: the game claims the original's size and checksum.
# With any other exe, App::CheckVersionFile fails: the game quits every
# 4000 frames and rejects the score.dat records and replays it wrote, as
# the original does when modified.
# It works for both the standalone exe and the hooked game (`just run`),
# whose DLL then redirects ChecksumExecutable; the compared objects stay
# vanilla.
orig_checksum = "FEAT_ORIG_CHECKSUM"

[hooks]
progress = true

[replay]
hook = "scripts/replay_hook.py"
