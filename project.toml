# th08: 東方永夜抄 ~ Imperishable Night, 1.00d

[game]
name = "th08"
title = "東方永夜抄 1.00d"
window_title = "東方永夜抄"
dir = "orig/th08_100d"
exe = "th08.exe"
checksums = "orig/th08_100d.sha1"
original = "build/th08_100d.exe"
game_end = 0x475298  # D3DX8's tables, D3DX8 and the CRT follow

[ghidra]
project = "th08_100d"
functions = "build/functions_100d.csv"

[build]
cflags = ["/Od", "/Gr", "/GX", "/Oi"]
lib = ['C:\dx8\lib', 'C:\msvc7\lib', 'C:\psdk\Lib']

[exe]
# The exe's objects are compiled with TH08_EXE, which defines the
# game's data and globals in the files that own them; the DLL build
# binds the original's instead. The link order also decides which copy
# of an inline function compare and the DLL keep.
obj_dir = "build/obj_exe"
defines = ["TH08_EXE=1"]
link_order = "median"
# The original's import table lists DINPUT8, DSOUND and d3d8 first and
# ADVAPI32 and ole32 last; D3DX8 follows the game code and the CRT comes
# last.
libs = ["dinput8.lib", "dsound.lib", "d3d8.lib", "d3dx8.lib", "dxguid.lib", "winmm.lib",
        "kernel32.lib", "user32.lib", "gdi32.lib", "advapi32.lib", "ole32.lib", "uuid.lib",
        "libcmt.lib"]

[hooks]
progress = true
