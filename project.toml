# th08: 東方永夜抄 ~ Imperishable Night, 1.00d

[game]
name = "th08"
title = "東方永夜抄 1.00d"
window_title = "東方永夜抄"
dir = "orig/th08_100d"
exe = "th08.exe"
checksums = "orig/th08_100d.sha1"
original = "build/th08_100d.exe"
game_end = 0x475298  # D3DX8's tables, D3DX8 and the CRT follow

[ghidra]
project = "th08_100d"
functions = "build/functions_100d.csv"

[build]
cflags = ["/Od", "/Gr", "/GX", "/Oi", "/Gy"]
# The game's code was compiled with DirectX 8.0's headers (its
# D3DXIMAGE_INFO has 8.0's 20 bytes, not 8.1's 28) but linked with
# DirectX 8.1's libraries: C:\dx81\lib is DXF/DXSDK/lib from the
# DirectX 8.1 SDK (dx81sdk_full.exe). It brings Rich header entries the
# original has (18/8444, the 8 objects without a comp.id, 28/9178,
# Implib700/9210), but its C++ objects say 9178 where the original's say
# 9177: the original's SDK was a slightly different build.
lib = ['C:\dx81\lib', 'C:\msvc7\lib', 'C:\msvc7\PlatformSDK\Lib', 'C:\psdk\Lib']
hook = "scripts/build_hook.py"  # the standalone exe's DOS stub

[exe]
# The exe's objects are compiled with TH08_EXE, which defines the
# game's data and globals in the files that own them; the DLL build
# binds the original's instead. The link order also decides which copy
# of an inline function compare and the DLL keep.
obj_dir = "build/obj_exe"
defines = ["TH08_EXE=1"]
link_order = "median"
# The stub stands in for the original's header space; see
# scripts/build_hook.py.
ldflags = ["/SUBSYSTEM:WINDOWS", "/FIXED", "/OPT:REF", "/OPT:ICF", "/OPT:NOWIN98", "/STUB:build\\stub.bin",
           "/NODEFAULTLIB:libc.lib"]
# The original's import table lists DINPUT8, DSOUND and d3d8 first and
# ADVAPI32 and ole32 last; D3DX8 follows the game code and the CRT comes
# last.
libs = ["dinput8.lib", "dsound.lib", "d3d8.lib", "d3dx8.lib", "dxguid.lib", "winmm.lib",
        "kernel32.lib", "user32.lib", "gdi32.lib", "advapi32.lib", "ole32.lib", "uuid.lib",
        "libcmt.lib"]

[psdk]
# VS.NET 2002's own import libraries, which `just psdk-libs` extracts.
libs = ["AdvAPI32.Lib", "Gdi32.Lib", "Kernel32.Lib", "Ole32.Lib", "User32.Lib", "Uuid.Lib", "WinMM.Lib"]

[exe.features]
# FEAT=orig_checksum: the exe claims the original's size and checksum.
# Any other exe crashes when it loads score.dat (App::CheckVersionFile),
# as the original does when modified.
orig_checksum = "FEAT_ORIG_CHECKSUM"

[hooks]
progress = true
